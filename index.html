<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <header> é uma tag semâtica: ela existe especificamente para marca o cabeçalho do site.
    class="header" conecta essa tag com o CSS -->
    <header class="header">
        <!-- Essa div é só um "envelope" interno, usado para limitar a largura do conteúdo e organizar os itens com Flexbox -->
        <div class="header-inner">
            <a href="#" class="logo">
                <img src="./assets/Imagem.png"alt="Logo da Athena">

                <h2 style="color: #000000;"> Athena<span
              ></span></h2>
            </a>

            <ul class="nav" id="nav">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Explora</a></li>
                <li><a href="#">Categoria</a></li>
                <li><a href="#">Minha biblioteca</a></li>
                <li><a href="#">Depoimentos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>

            <div class="actions">
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-cadastrar">Cadastrar</a>
            </div>
        </div> 
    </header>
</body>
</html>
